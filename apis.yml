description: Vast is a commercial space company building next-generation crewed space
  stations, beginning with Haven-1 (the first commercial space station, targeting a
  2026 launch on a SpaceX Falcon 9) and the larger Haven-2. Vast is an aerospace
  hardware and human-spaceflight company; as of this writing it does not publish a
  public developer API. The surfaces catalogued here are informational product,
  research, and partnership pages rather than programmable HTTP APIs.
