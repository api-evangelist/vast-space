description: >-
  Vast does not publish a public, self-serve, usage-metered API pricing model.
  As an aerospace hardware and human-spaceflight company, Vast monetizes
  through space-station programs (Haven-1, Haven-2), Haven-1 Lab payload slots,
  and research/partnership agreements negotiated directly. Payload access is
  arranged via Request for Proposals (RFP) and payload-partner contracts rather
  than published tiers. No public API plans exist to reconcile.
notes: >-
  This artifact is a placeholder documenting the absence of public API pricing.
  Payload-partner and research engagement terms are negotiated directly with
  Vast; consult the Haven-1 Lab page and contact Vast for current commercial
  terms. Do not confuse with Vast.ai (GPU cloud) or VAST Data (storage), which
  are unrelated companies.
sources:
- https://www.vastspace.com/
