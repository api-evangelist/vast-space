principles:
- name: Visibility
  description: No API usage telemetry exists; track engagement against negotiated payload/research contracts instead.
- name: Allocation
  description: Allocate payload and mission costs by program (Haven-1, Haven-2) and by partnership agreement.
- name: Optimization
  description: Optimization is mission/payload scoping, not API call reduction; right-size payload mass, power, and slot count.
- name: Accountability
  description: Assign program owners for each payload partnership and review against contractual milestones.
