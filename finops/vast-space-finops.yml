description: >-
  FinOps view of Vast. Because Vast publishes no public, usage-metered developer
  API, there is no cloud-style consumption spend to instrument, allocate, or
  optimize. Vast's commercial relationships are capital programs and
  payload/research partnership agreements (Haven-1, Haven-2, Haven-1 Lab)
  negotiated directly, billed by contract rather than by per-request or
  per-token metering. This artifact documents the absence of an API spend model.
notes: >-
  Placeholder FinOps artifact. There are no API usage meters because no public
  API exists. Engagement costs are contractual; consult Vast for payload-partner
  and research terms. Not to be confused with Vast.ai (GPU cloud) or VAST Data
  (storage), which do have usage-based cloud spend models.
